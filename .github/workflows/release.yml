name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # nuget.org Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test LINQtoCSV.Tests/LINQtoCSV.Tests.csproj -c Release -p:GeneratePackageOnBuild=false

      - name: Build
        run: dotnet build LINQtoCSV/LINQtoCSV.csproj -c Release -p:Version=${{ env.VERSION }} -p:GeneratePackageOnBuild=false

      - name: Pack
        run: dotnet pack LINQtoCSV/LINQtoCSV.csproj -c Release --no-build -o out -p:Version=${{ env.VERSION }}

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: amargo

      - name: Push
        run: dotnet nuget push out/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
